<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>料理チャンス運用効率化ツール - ログイン</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-box {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .auth-box h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .auth-box p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .auth-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        .auth-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .auth-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .auth-btn:active {
            transform: translateY(0);
        }

        .auth-error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="auth-box">
        <h2>🔒 アクセス制限</h2>
        <p>このツールにアクセスするにはパスワードが必要です</p>
        <input 
            type="password" 
            class="auth-input" 
            id="authInput" 
            placeholder="パスワードを入力"
            autocomplete="off"
        >
        <button class="auth-btn" onclick="verifyAccess()">アクセス</button>
        <div class="auth-error" id="authError">パスワードが正しくありません</div>
    </div>

    <script>
        const _0x4a2b = {
            s: 'pks2025_salt_v1',  // ソルト
            i: 10000,              // イテレーション回数
            h: '3ef28f6b244ef9bbfd23f7379c9226668bc18ba049e03e7660676a2777169c5e'  // 正しいハッシュ値
        };

        // SHA-256ハッシュ関数
        async function _0x7c3d(input) {
            const encoder = new TextEncoder();
            const data = encoder.encode(input);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // 複数回ハッシュ化（ストレッチング）
        async function _0x9f1e(password) {
            let hash = password + _0x4a2b.s;
            for (let i = 0; i < _0x4a2b.i; i++) {
                hash = await _0x7c3d(hash);
            }
            return hash;
        }

        // アクセス検証
        async function verifyAccess() {
            const input = document.getElementById('authInput').value;
            const error = document.getElementById('authError');
            
            if (!input) {
                error.style.display = 'block';
                error.textContent = 'パスワードを入力してください';
                return;
            }

            const hash = await _0x9f1e(input);
            
            if (hash === _0x4a2b.h) {
                // 認証成功 - sessionStorageに保存してtool.htmlへリダイレクト
                sessionStorage.setItem('_auth', '1');
                window.location.href = 'tool.html';
            } else {
                // 認証失敗
                error.style.display = 'block';
                error.textContent = 'パスワードが正しくありません';
                document.getElementById('authInput').value = '';
                document.getElementById('authInput').focus();
            }
        }

        // Enterキーでも認証
        document.addEventListener('DOMContentLoaded', function() {
            const authInput = document.getElementById('authInput');
            authInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    verifyAccess();
                }
            });

            // 既に認証済みの場合は直接tool.htmlへ
            if (sessionStorage.getItem('_auth') === '1') {
                window.location.href = 'tool.html';
            }

            // フォーカス
            authInput.focus();
        });
    </script>
</body>
</html>
